<style>
:root{--bg:#0A0E1A;--card:#1E293B;--ink:#F1F5F9;--mut:#94A3B8;--line:#2A3650;--acc:#00FF66;--accink:#04210F;--navy:#0F1626;--navyink:#fff;--good:#00FF66;--goodbg:rgba(0,255,102,.12);--bad:#FF7A00;--badbg:rgba(255,122,0,.14);--inp:#141C2E;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:'Hind Siliguri','Noto Sans Bengali','Kalpurush',system-ui,sans-serif;font-size:16px;line-height:1.45;padding-bottom:84px}
header{background:var(--navy);color:var(--navyink);padding:16px 16px 14px;border-bottom:4px solid var(--acc)}

.hs button{font:inherit;color:var(--navyink);background:none;border:0;padding:0;text-decoration:underline;opacity:.85;cursor:pointer}
.chip{font-size:12.5px;font-weight:600;padding:1px 9px;border-radius:99px;background:var(--acc);color:var(--accink)}
main{max-width:560px;margin:0 auto;padding:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.card.owe{border-color:var(--bad);border-width:2px}

h2{font-size:16px;margin:0 0 10px;font-weight:600}
.rate{background:var(--navy);color:var(--navyink);border-radius:12px;padding:16px;margin-bottom:12px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px}

.rw{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
.nm{font-size:18px}
.bd{font-size:14px;font-weight:600;padding:3px 10px;border-radius:99px;background:var(--inp);color:var(--mut)}

.fr{display:grid;grid-template-columns:1fr 1fr;gap:8px}

.x{font:inherit;font-size:20px;line-height:1;width:32px;height:32px;border:0;border-radius:8px;background:var(--badbg);color:var(--bad);cursor:pointer}
.empty,.note{color:var(--mut);text-align:center;padding:10px 0 4px}

.banner{background:var(--goodbg);color:var(--good);border-radius:10px;padding:10px 12px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:600}

.sc{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--card);margin-bottom:12px}

.lk{font:inherit;font-size:14px;background:none;border:0;color:var(--mut);text-decoration:underline;padding:0 0 8px;cursor:pointer}
.stp{display:flex;gap:14px}.sp small{display:block;color:var(--mut);font-size:12px;text-align:center}.sp div{display:flex;align-items:center;gap:6px}.sp b{min-width:24px;text-align:center}.x2{font:inherit;font-size:20px;font-weight:700;width:36px;height:36px;border:0;border-radius:8px;background:var(--acc);color:var(--accink);cursor:pointer}
.hs button.chip{text-decoration:none;opacity:1;background:var(--acc);color:var(--accink);border:0;font-weight:600;font-size:12.5px;padding:1px 10px;cursor:pointer}
#bar{position:fixed;left:0;right:0;bottom:calc(58px + env(safe-area-inset-bottom,0px));background:var(--card);border-top:1px solid var(--line);padding:8px 10px;display:flex;align-items:center;gap:8px;z-index:6}#bar[hidden]{display:none}
.x3{font:inherit;font-size:20px;font-weight:700;border:1px solid var(--line);background:var(--inp);color:var(--ink);border-radius:8px;width:44px;min-height:44px;cursor:pointer}button:disabled{opacity:.4;cursor:default}.cnt{flex:1;font-size:13px;color:var(--mut);line-height:1.2}
.credit{text-align:center;color:var(--mut);font-size:13px;padding:0 0 12px}
.logbox{max-height:300px;overflow-y:auto;overscroll-behavior:contain;border-top:1px solid var(--line);padding-right:4px}
.jsum{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.jsc{background:linear-gradient(135deg,var(--navy),#2c4170);color:#fff;border-radius:14px;padding:12px 14px}
.jsc span{display:block;font-size:12.5px;opacity:.78}.jsc b{font-size:22px;color:var(--acc)}
.jmc{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-left:5px solid var(--acc);border-radius:14px;padding:12px;margin-bottom:10px;cursor:pointer}
.av{width:42px;height:42px;border-radius:50%;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px;flex:none}
.jmi{flex:1;min-width:0}.jmi b{display:block;font-size:17px}.jmi small{display:block;color:var(--mut);font-size:12.5px}
.jmt{text-align:right}.jmt span{display:block;font-size:12px;color:var(--mut)}.jmt b{font-size:19px;color:var(--good)}
.jh{margin:-4px 0 10px;padding:6px 12px;background:var(--inp);border-radius:10px}.jr{display:flex;justify-content:space-between;padding:4px 0;font-size:14px}
.mdb{position:fixed;inset:0;background:rgba(8,14,28,.55);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.mds{width:100%;max-width:560px;max-height:88vh;overflow-y:auto;background:var(--card);border-radius:20px 20px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom,0px))}
.mdb.anim{animation:fadeIn .2s ease}.mdb.anim .mds{animation:slideUp .28s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}@keyframes slideUp{from{transform:translateY(60px);opacity:.4}to{transform:none;opacity:1}}
.mdh{display:flex;align-items:center;gap:12px;margin-bottom:12px}.mdh b{font-size:19px;display:block}.mdh small{color:var(--mut)}.mdh .x{margin-left:auto}
.jin{width:96px!important;margin:0!important;min-height:36px!important}
.sbtn{width:auto!important;min-height:34px!important;padding:0 11px!important;font-size:14px}
.hlr td{background:rgba(0,255,102,.10)}.hlr td:first-child{background:rgba(0,255,102,.22)}.sc td{padding:9px 6px}
.rate2{background:linear-gradient(160deg,#162038,#0F1626);border:1px solid rgba(0,255,102,.35);border-radius:22px;padding:22px 16px 18px;margin-bottom:14px;text-align:center;box-shadow:0 0 28px rgba(0,255,102,.14)}
.rate2 small{display:block;color:var(--mut);font-weight:600;font-size:14px}
.rate2 .big{font-size:56px;font-weight:700;line-height:1.1;color:var(--acc);text-shadow:0 0 18px rgba(0,255,102,.45)}
.rate2 em{font-style:normal;color:var(--mut);font-weight:600;margin-left:8px;font-size:16px}
.rate2 .rsub{color:var(--mut);font-size:13px;margin-top:6px}
.mc{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;background:var(--card);border-radius:18px;padding:14px;margin-bottom:12px;border:1px solid var(--line)}
.mcn{display:flex;align-items:center;gap:8px;font-size:18px;font-weight:700;margin-bottom:8px}
.ml{display:flex;align-items:center;gap:7px;color:#CBD5E1;font-size:13.5px;margin-bottom:3px}
.ml svg{color:var(--mut);flex:none}
.mb{flex:none;max-width:48%;text-align:center;font-weight:700;font-size:13px;padding:8px 12px;border-radius:14px;line-height:1.25}
.mb.gray{background:rgba(255,255,255,.1);color:var(--mut)}
.mb.neg{background:rgba(255,122,0,.18);color:var(--bad);border:1px solid rgba(255,122,0,.6);box-shadow:0 0 14px rgba(255,122,0,.35)}
.mc.owe{border:2px solid var(--bad);box-shadow:0 0 18px rgba(255,122,0,.25)}
@keyframes mcIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes rateIn{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:none}}
.mc.new{animation:mcIn .5s cubic-bezier(.16,1,.3,1) both}.mc:nth-of-type(2){animation-delay:.08s}.mc:nth-of-type(3){animation-delay:.16s}.mc:nth-of-type(4){animation-delay:.24s}.mc:nth-of-type(5){animation-delay:.32s}.mc:nth-of-type(6){animation-delay:.40s}
.rate2{animation:rateIn .6s cubic-bezier(.16,1,.3,1) both}
.vscreen{animation:vIn .42s cubic-bezier(.16,1,.3,1) both}@keyframes vIn{from{opacity:0;transform:translateX(26px)}to{opacity:1;transform:none}}
.sheet{animation:sheetUp .45s cubic-bezier(.16,1,.3,1) both}@keyframes sheetUp{from{transform:translateY(100%)}to{transform:none}}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
nav button{font:inherit;font-size:14px;font-weight:500;background:none;border:0;color:var(--mut);padding:10px 0;border-radius:8px;cursor:pointer;min-height:44px}
nav button.on{color:var(--accink);background:var(--acc);font-weight:700}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--navy);color:var(--navyink);padding:9px 16px;border-radius:99px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:9;white-space:nowrap}
#toast.on{opacity:1}
</style>
</head>
<body>
<header><h1>মিল ক্যালকুলেটর</h1><div class="hs"><button id="mb"></button><span class="chip" id="rc" hidden></span><button class='chip' id='eb' hidden onclick='toggleEdit()'></button><span id='sv' style='font-size:12.5px;opacity:.9'></span></div></header>
<main id="v"></main><div class='credit'>App created by Shom Chandra Das<br><a href='mailto:skshom17@gmail.com' style='color:inherit'>skshom17@gmail.com</a></div>
<nav id="nv">
<button data-t="summary">সামারি</button>
<button data-t="bazar">বাজার</button>
<button data-t="meal">মিল</button>
<button data-t="jama">জমা</button>
<button data-t="set">সেটিং</button>
</nav>
<div id='bar' hidden></div><div id='md'></div><div id="toast"></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const f=n=>(Math.round(n*100)/100).toLocaleString('en-US',{maximumFractionDigits:2});
const C=window.claude;
const cur=(()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')})();
let db=null,isAdmin=false,cw=true,status='loading';
Object.defineProperty(window,'canW',{get:()=>cw&&editing&&!locked(),set:v=>{cw=v}});
let month=cur,tab='summary',armed=null;
let cfg=null,mdoc={},mExists=false,mLoaded=false,bazar=[],jama=[],months=[],subs=[];
let myId=null,pnames={},logs=[],extra=[],dl=null,uapi=null,qd=null,pend=0,sB=[],sJ=[],sX=[],ops=[],rd=[],editing=true,eff=null;

function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),2000)}
function mlabel(ym){try{const[y,m]=ym.split('-').map(Number);return new Date(y,m-1,1).toLocaleDateString('bn-BD',{month:'long',year:'numeric'})}catch(e){return ym}}
function dim(){const[y,m]=month.split('-').map(Number);return new Date(y,m,0).getDate()}
function defDay(){return month===cur?new Date().getDate():1}
const MEM=()=>E().mem;
const meals=()=>E().M;
const locked=()=>E().lock;
function who(id){const m=MEM().find(x=>x.id===id);return m?m.name:'—'}
function hasData(id){const ml=meals();return jama.some(j=>j.who===id)||Object.keys(ml).some(k=>k.endsWith('_'+id)&&ml[k])}
function mems(entry){return MEM().filter(m=>m.active!==false||(!entry&&hasData(m.id)))}

/* ---------- online data ---------- */
function onErr(e){if(e&&e.code==='revoked'){status='nodb';render()}}

/* ---------- accounts, access code, roles (Firebase) ---------- */
const FIREBASE_CONFIG={apiKey:"AIzaSyBTicx4JNMnbSM8O3Qw5BF0Wemm0s0j3Yg",authDomain:"meal-51bc8.firebaseapp.com",projectId:"meal-51bc8",storageBucket:"meal-51bc8.firebasestorage.app",messagingSenderId:"690690680963",appId:"1:690690680963:web:3958a60e9a646738f4d3b6"}; /* optional: paste config here instead of using the setup screen */
let auth=null,fs=null,me=null,mid=null,role=null,appUsers=[],messTitle='',authMode='in',unsubs=[],started=false,errMsg='';
const roleBn=r=>({admin:'অ্যাডমিন',editor:'এডিটর',viewer:'ভিউয়ার'})[r]||r;
const b64e=t=>btoa(unescape(encodeURIComponent(t))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const b64d=t=>decodeURIComponent(escape(atob(t.replace(/-/g,'+').replace(/_/g,'/'))));
function onErr(e){console.warn(e);if(e&&e.code==='permission-denied')toast('অনুমতি নেই')}
function stopAll(){subs.forEach(u=>u());subs=[];unsubs.forEach(u=>u());unsubs=[];started=false;cfg=null;months=[];sB=[];sJ=[];sX=[];trash=[];logs=[];appUsers=[];mdoc={};mLoaded=false;ops=[];rd=[];db=null}
function fbCfg(){
  if(FIREBASE_CONFIG&&FIREBASE_CONFIG.apiKey)return FIREBASE_CONFIG;
  try{
    if(location.hash.length>2){
      const p=new URLSearchParams(location.hash.slice(1));
      if(p.get('c')){const c=JSON.parse(b64d(p.get('c')));if(c.apiKey)localStorage.setItem('mc:fb',JSON.stringify(c))}
      if(p.get('j'))localStorage.setItem('mc:j',p.get('j'));
      history.replaceState(null,'',location.pathname);
    }
  }catch(e){}
  try{return JSON.parse(localStorage.getItem('mc:fb')||'null')}catch(e){return null}
}
function init(){
  if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
  const c=fbCfg();
  if(!c){status='setup';render();return}
  try{firebase.initializeApp(c);auth=firebase.auth();fs=firebase.firestore()}catch(e){status='error';errMsg=e.message;render();return}
  status='loading';render();
  auth.onAuthStateChanged(async u=>{
    me=u;stopAll();mid=null;role=null;
    if(!u){status='login';render();return}
    status='loading';render();
    try{
      const us=await fs.doc('users/'+u.uid).get();
      mid=us.exists?us.data().mess:null;
      if(mid)beginMess();else{status='join';render()}
    }catch(e){status='error';errMsg=e.message;render()}
  });
}
function beginMess(){
  db={doc:p=>fs.doc('messes/'+mid+'/'+p),collection:p=>fs.collection('messes/'+mid+'/'+p)};
  myId=me.uid;
  unsubs.push(fs.doc('messes/'+mid+'/members/'+me.uid).onSnapshot(s=>{
    if(!s.exists){fs.doc('users/'+me.uid).delete().catch(()=>{});stopAll();mid=null;status='join';render();return}
    const d=s.data();role=d.role;isAdmin=role==='admin';cw=role!=='viewer';
    if(!started){started=true;status='ok';startWatch()}
    render();
  },e=>{status='error';errMsg=e.message;render()}));
}
function startWatch(){
  unsubs.push(fs.doc('messes/'+mid).onSnapshot(s=>{if(s.exists){messTitle=s.data().title||'';render()}},onErr));
  unsubs.push(db.doc('config/app').onSnapshot(s=>{cfg=s.exists?s.data():{members:[]};render()},onErr));
  unsubs.push(db.collection('months').onSnapshot(s=>{months=s.docs.map(d=>d.id);render()},onErr));
  unsubs.push(db.collection('members').onSnapshot(s=>{appUsers=s.docs.map(d=>({uid:d.id,...d.data()}));appUsers.forEach(u=>pnames[u.uid]=u.name||'');render()},onErr));
  watchMonth();
}
function authErr(e){const c=(e&&e.code)||'';return ({'auth/invalid-email':'ইমেইল ঠিক নেই','auth/missing-password':'পাসওয়ার্ড লিখুন','auth/weak-password':'পাসওয়ার্ড কমপক্ষে ৬ অক্ষর দিন','auth/email-already-in-use':'এই ইমেইলে আগেই অ্যাকাউন্ট আছে','auth/user-not-found':'এই ইমেইলে অ্যাকাউন্ট নেই','auth/wrong-password':'পাসওয়ার্ড ভুল','auth/invalid-credential':'ইমেইল বা পাসওয়ার্ড ভুল','auth/network-request-failed':'ইন্টারনেট নেই','auth/too-many-requests':'অনেকবার চেষ্টা হয়েছে, একটু পরে আবার দিন','auth/operation-not-allowed':'Firebase-এ Email/Password চালু করা হয়নি'})[c]||('সমস্যা হয়েছে: '+c)}

/* ---------- calculation ---------- */
function calc(){
  const tb=bazar.reduce((s,b)=>s+(+b.amt||0),0);
  const ml=meals();
  const rows=mems(false).map(m=>{
    let n=0,g=0;for(let d=1;d<=31;d++){n+=+ml[d+'_'+m.id]||0;g+=+ml['g'+d+'_'+m.id]||0}
    const j=jama.filter(x=>x.who===m.id).reduce((s,x)=>s+(+x.amt||0),0);
    return{m,ml:n+g,g,j};
  });
  const tm=rows.reduce((s,r)=>s+r.ml,0);
  const rate=tm?tb/tm:0;
  const te=extra.reduce((s,x)=>s+(+x.amt||0),0),sh=rows.length?te/rows.length:0;
  rows.forEach(r=>{r.food=r.ml*rate;r.ex=sh;r.bal=r.j-r.food-sh});
  const tj=rows.reduce((s,r)=>s+r.j,0);
  const owe=rows.reduce((s,r)=>s+(Math.round(r.bal)<0?-r.bal:0),0);
  return{tb,tm,rate,rows,tj,cash:tj-tb-te,owe,te,sh};
}
function st(r){
  if(!(r.ml>0||r.j>0||r.ex>0))return{k:'',t:'কোনো হিসাব নেই'};
  const b=Math.round(r.bal);
  if(b===0)return{k:'ok',t:'হিসাব ক্লোজ ✓'};
  return b<0?{k:'owe',t:'−'+f(-r.bal)}:{k:'get',t:'+'+f(r.bal)};
}

async function flush(){

      else if(o.t==='meal')mm[o.k]=o.v;
      else if(o.t==='lock')await db.doc(p).update({locked:o.v});
      else if(o.t==='edit')await db.doc(p+'/'+o.c+'/'+o.id).update(o.d);
      else if(o.t==='mem')await db.doc('config/app').set({members:o.l});

  }catch(e){
    ok=false;
    if(e&&(e.code==='permission-denied'||e.code==='invalid_argument')){ops=ops.filter(o=>!sent.includes(o));toast('অনুমতি নেই, বদল সেভ হয়নি');setSv('')}

}

  if(!trash.length||!isAdmin||!ready(true))return;
  const list=[...trash],p='months/'+month;toast('ফিরিয়ে আনা হচ্ছে…');
  (async()=>{try{await ensureMonth(p);for(const t of list)await restoreDoc(t,p);await logE(p,'মুছে ফেলা সব তথ্য ফিরিয়ে আনা হয়েছে');toast('সব ফিরিয়ে আনা হয়েছে ✓')}catch(e){toast('ফেরানো যায়নি')}})();
}
async function purgeM(id){
  let used=false;
  try{
    for(const ym of months){
      const d=await db.doc('months/'+ym).get();
      const ml=(d.exists&&d.data().meals)||{};
      if(Object.keys(ml).some(k=>k.endsWith('_'+id)&&ml[k])){used=true;break}
      for(const c of ['jama','bazar']){
        const r=await db.collection('months/'+ym+'/'+c).where('who','==',id).limit(1).get();
        if(!r.empty){used=true;break}
      }
      if(used)break;
    }
  }catch(e){toast('যাচাই করা যায়নি');return}
  if(used){toast('পুরনো হিসাব আছে, মুছা যাবে না');return}
  saveMembers(MEM().filter(m=>m.id!==id),'',who(id)+' সদস্য স্থায়ীভাবে মুছে ফেলা হয়েছে');
  toast('মুছে ফেলা হয়েছে');
}
window.addEventListener('beforeunload',e=>{if(ops.length){e.preventDefault();e.returnValue=''}});
init();
</script>
